[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-scaffold"
version = "0.1.0"
description = "A lightweight production-minded AI project scaffold"
authors = [ { name = "AI Scaffold" } ]
requires-python = ">=3.10"

[project.dependencies]
fastapi = "^0.95"
uvicorn = "^0.22"
pydantic = "^1.10"
pyyaml = "^6.0"
jsonschema = "^4.0"
# RAG dependencies
sentence-transformers = "^2.7"
qdrant-client = "^1.9"
tiktoken = "^0.7"

[project.optional-dependencies]
dev = [
  "pytest",
  "httpx",
  "requests",
]
