# Qdrant Helm values
# Chart: https://qdrant.github.io/helm-charts
# Install: helm install qdrant qdrant/qdrant -n gpu-workloads -f infra/qdrant/values.yaml

replicaCount: 1

image:
  repository: qdrant/qdrant
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 6333        # REST API  → used by qdrant-client in Python
  grpcPort: 6334    # gRPC API  → optional, kept for future use

persistence:
  accessModes: ["ReadWriteOnce"]
  size: 5Gi

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

# Toleration: allows Qdrant to schedule on the GPU-tainted node
# The pod doesn't USE the GPU — it just tolerates the taint to land on the same node
tolerations:
  - key: "nvidia.com/gpu"
    operator: "Equal"
    value: "present"
    effect: "NoSchedule"

# No auth for now (internal cluster only via ClusterIP)
apiKey: ""

config:
  cluster:
    enabled: false
